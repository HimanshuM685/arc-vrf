name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests (proofs generated by the TypeScript prover via ffi)
        working-directory: contracts
        run: forge test --ffi

      - name: Node typecheck and tests
        working-directory: node
        run: npx tsc --noEmit && pnpm test

      - name: SDK typecheck
        run: pnpm --filter @arc-vrf/sdk typecheck

      - name: Web build
        run: pnpm --filter web build

      - name: Node bundle
        run: pnpm --filter @arc-vrf/node build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t arc-vrf:ci .
