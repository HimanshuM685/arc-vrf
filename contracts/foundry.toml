[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 500
# ffi stays off here; `pnpm contracts:test` passes --ffi because the tests generate proofs
# with the TypeScript prover (node/src/cli/prove.ts).

[rpc_endpoints]
# Alchemy only (no public RPCs): `forge ... --rpc-url arc_testnet` reads these from the environment.
arc_testnet = "${RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
