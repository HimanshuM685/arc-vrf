[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 500
# ffi stays off here; `pnpm contracts:test` passes --ffi because the tests generate proofs
# with the TypeScript prover (node/src/cli/prove.ts).

[rpc_endpoints]
# Arc's public RPCs (the first of the list in packages/sdk/src/chains.ts).
arc_testnet = "https://arc-testnet-rpc.publicnode.com"
arc_mainnet = "https://rpc.mainnet.arc.io"
anvil = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
