[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 500
# test-only: proofs are generated by the TypeScript node (node/src/cli/prove.ts)
ffi = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../node/test/fixtures" },
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
anvil = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
