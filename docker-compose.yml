# Arc VRF production stack: `make up` (or `docker compose up -d --build`).
# Values come from .env next to this file. Only the variables listed per service enter that
# container: the website never sees a signing key, and DEPLOYER_KEY never enters either container.
# Both use Arc's public RPCs, hard-coded in packages/sdk/src/chains.ts, with failover: no RPC settings.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # Public dashboard. Stateless: to scale, run more copies behind your load balancer.
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    image: arc-vrf:latest
    ports:
      # Empty WEB_BIND publishes on every interface, IPv4 and IPv6.
      - "${WEB_BIND:+${WEB_BIND}:}${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    logging: *logging

  # The VRF oracle. Holds the keys, no public port.
  # Exactly ONE replica: two nodes would race to answer the same requests and waste gas.
  vrf-node:
    image: arc-vrf:latest
    pull_policy: never # built by the web service above
    command: ["node", "vrf-node.mjs"]
    environment:
      VRF_PROVING_KEY: ${VRF_PROVING_KEY:?set VRF_PROVING_KEY in .env}
      NODE_TX_KEY: ${NODE_TX_KEY:?set NODE_TX_KEY in .env}
      # Optional overrides; empty means "use the deployment file for this chain".
      COORDINATOR: ${COORDINATOR:-}
      START_BLOCK: ${START_BLOCK:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MIN_BALANCE_USDC: ${MIN_BALANCE_USDC:-1}
      POLL_MS: ${POLL_MS:-30000}
      # Optional: replace the built-in public RPC list (e.g. an archive node). Empty = the list.
      RPC_URL: ${RPC_URL:-}
      RPC_WS_URL: ${RPC_WS_URL:-}
      HEALTH_PORT: "8080"
    depends_on: [web] # only so the shared image is built first
    deploy:
      replicas: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    logging: *logging
